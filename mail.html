<html>
  <div
    style="
      margin: 0;
      padding: 0;
      background: #050505;
      font-family:
        Inter,
        Segoe UI,
        Arial,
        sans-serif;
    "
  >
    <table
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="padding: 20px 12px"
    >
      <tr>
        <td align="center">
          <!-- Container -->
          <table
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="
              max-width: 540px;
              background: linear-gradient(145deg, #0d0d0d, #111111);
              border-radius: 16px;
              overflow: hidden;
              border: 1px solid #1f1f1f;
              box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            "
          >
            <!-- Header -->
            <tr>
              <td
                style="
                  padding: 18px 20px;
                  background: linear-gradient(90deg, #111827, #1f2937);
                  border-bottom: 1px solid #2a2a2a;
                "
              >
                <table>
                  <tr>
                    <td>
                      <img
                        src="cid:app-logo"
                        width="36"
                        height="36"
                        style="
                          border-radius: 8px;
                          display: block;
                          box-shadow: 0 0 8px rgba(255, 255, 255, 0.1);
                        "
                      />
                    </td>
                    <td style="padding-left: 12px">
                      <div
                        style="
                          font-size: 14px;
                          font-weight: 700;
                          color: #f9fafb;
                          letter-spacing: 0.3px;
                        "
                      >
                        Nishan Rajak
                      </div>
                      <div style="font-size: 11px; color: #9ca3af">
                        Portfolio Contact
                      </div>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- Body -->
            <tr>
              <td style="padding: 22px">
                <!-- Title -->
                <div
                  style="
                    font-size: 18px;
                    font-weight: 700;
                    color: #ffffff;
                    margin-bottom: 18px;
                  "
                >
                  New Contact Message
                </div>

                <!-- Info Cards -->
                <div style="margin-bottom: 18px">
                  <!-- Name -->
                  <div
                    style="
                      margin-bottom: 10px;
                      padding: 10px 12px;
                      background: #0f0f0f;
                      border: 1px solid #222;
                      border-radius: 10px;
                    "
                  >
                    <div style="font-size: 11px; color: #6b7280">Name</div>
                    <div
                      style="font-size: 14px; font-weight: 600; color: #e5e7eb"
                    >
                      ${name}
                    </div>
                  </div>

                  <!-- Email -->
                  <div
                    style="
                      margin-bottom: 10px;
                      padding: 10px 12px;
                      background: #0f0f0f;
                      border: 1px solid #222;
                      border-radius: 10px;
                    "
                  >
                    <div style="font-size: 11px; color: #6b7280">Email</div>
                    <div
                      style="font-size: 14px; font-weight: 600; color: #e5e7eb"
                    >
                      ${email}
                    </div>
                  </div>

                  <!-- Date -->
                  <div
                    style="
                      padding: 10px 12px;
                      background: #0f0f0f;
                      border: 1px solid #222;
                      border-radius: 10px;
                    "
                  >
                    <div style="font-size: 11px; color: #6b7280">Submitted</div>
                    <div
                      style="font-size: 14px; font-weight: 600; color: #e5e7eb"
                    >
                      ${submittedAt || new Date().toLocaleString()}
                    </div>
                  </div>
                </div>

                <!-- Message -->
                <div
                  style="font-size: 12px; color: #9ca3af; margin-bottom: 6px"
                >
                  Message
                </div>

                <div
                  style="
                    background: #0a0a0a;
                    border: 1px solid #222;
                    border-radius: 12px;
                    padding: 14px;
                    font-size: 14px;
                    color: #d1d5db;
                    line-height: 1.6;
                    box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.6);
                  "
                >
                  ${message}
                </div>

                <!-- CTA -->
                <div style="text-align: center; margin-top: 24px">
                  <a
                    href="https://nishu.portfolio.vercel.app"
                    style="
                      display: inline-block;
                      padding: 11px 26px;
                      font-size: 13px;
                      font-weight: 600;
                      color: #ffffff;
                      text-decoration: none;
                      border-radius: 8px;
                      background: linear-gradient(190deg, #111111, #666666);
                      box-shadow: 0 6px 18px rgba(9, 9, 9, 0.4);
                    "
                  >
                    Visit Portfolio →
                  </a>
                </div>
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td
                style="
                  padding: 14px;
                  text-align: center;
                  font-size: 11px;
                  color: #6b7280;
                  background: #0a0a0a;
                  border-top: 1px solid #1f1f1f;
                "
              >
                © ${new Date().getFullYear()} Nishan Rajak • Built with
                precision
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </div>
</html>
